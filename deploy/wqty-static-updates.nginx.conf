# Add inside the existing HTTPS server block for wqty.online.
# Keep the existing root, certificates, redirects and homepage locations.
location = /updates/windows/latest.yml {
    default_type application/yaml;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location ^~ /updates/windows/ {
    # Keep legacy downloads available after the installer rename.
    if ($uri !~ "^/updates/windows/(tiaolv-music-electron-setup-|Tiaolv-Setup-)[0-9]+[.][0-9]+[.][0-9]+[.]exe([.]blockmap)?$") {
        return 404;
    }
    types {
        application/octet-stream exe blockmap;
        application/yaml yml;
    }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    autoindex off;
    try_files $uri =404;
}
